<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sermon Transcribe</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
        .st-login-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .st-login-col {
            width: 100%;
            max-width: 380px;
        }

        .st-login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .st-login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radiusLg);
            box-shadow: var(--shadowMd);
            padding: 32px 28px;
        }

        .st-login-card h1 {
            font-size: 19px;
            font-weight: 700;
            margin: 0 0 4px;
        }

        .st-login-card .st-subtitle {
            font-size: 13px;
            color: var(--textMuted);
            margin: 0 0 22px;
        }

        .st-login-card .st-alert-error {
            margin-bottom: 16px;
        }

        .st-login-card form .st-label {
            margin-bottom: 6px;
        }

        .st-login-card form .st-input {
            margin-bottom: 16px;
        }

        .st-login-card form .st-input:last-of-type {
            margin-bottom: 22px;
        }

        .st-login-submit {
            width: 100%;
            padding: 12px;
        }

        .st-login-footer {
            text-align: center;
            font-size: 12px;
            color: var(--textSubtle);
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="st-login-shell">
        <div class="st-login-col">
            <div class="st-login-brand">
                <div class="st-logo"><span></span><span></span><span></span></div>
                <div class="st-wordmark">Sermon Transcribe</div>
            </div>

            <div class="st-login-card">
                <h1>Sign in</h1>
                <p class="st-subtitle">Enter your credentials to access the dashboard.</p>

                {% if error %}
                <div class="st-alert-error">{{ error }}</div>
                {% endif %}

                <form method="POST" action="{{ url_for('login') }}" autocomplete="on">
                    <label class="st-label" for="username">Username</label>
                    <input
                        class="st-input"
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                        autofocus
                        placeholder="Enter your username"
                    >

                    <label class="st-label" for="password">Password</label>
                    <input
                        class="st-input"
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                        placeholder="Enter your password"
                    >

                    <button type="submit" class="st-btn st-btn-primary st-login-submit">Sign in</button>
                </form>
            </div>
            <p class="st-login-footer">Protected access · sermon transcription workspace</p>
        </div>
    </div>
</body>
</html>
