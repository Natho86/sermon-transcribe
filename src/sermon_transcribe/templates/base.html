<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sermon Transcribe{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}
    <div class="st-header">
        <div class="st-header-brand">
            <div class="st-logo"><span></span><span></span><span></span></div>
            <div class="st-wordmark">Sermon Transcribe</div>
        </div>
        <nav class="st-nav">
            <a href="{{ url_for('index') }}" class="{{ 'active' if active_page == 'dashboard' else '' }}">Dashboard</a>
            <a href="{{ url_for('settings') }}" class="{{ 'active' if active_page == 'settings' else '' }}">Settings</a>
            <div id="connectionStatus" class="st-status-pill offline">
                <div class="dot"></div>
                <span>Connecting…</span>
            </div>
            <a href="{{ url_for('logout') }}" class="st-logout">Log out</a>
        </nav>
        <button type="button" class="st-menu-btn" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
    </div>
    <div class="st-mobile-nav" id="mobileNav">
        <a href="{{ url_for('index') }}" class="{{ 'active' if active_page == 'dashboard' else '' }}">Dashboard</a>
        <a href="{{ url_for('settings') }}" class="{{ 'active' if active_page == 'settings' else '' }}">Settings</a>
        <a href="{{ url_for('logout') }}">Log out</a>
    </div>

    {% block content %}{% endblock %}

    <script>
        (function () {
            var toggle = document.getElementById('navToggle');
            var mobileNav = document.getElementById('mobileNav');
            if (toggle && mobileNav) {
                toggle.addEventListener('click', function () {
                    var open = mobileNav.classList.toggle('open');
                    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
            }
        })();
    </script>
    {% block scripts %}{% endblock %}
    {% endblock %}
</body>
</html>
